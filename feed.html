<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richfield Connect - Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">Richfield Connect</div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="feed.html" class="active">Feed</a></li>
            </ul>
        </nav>
    </header>

    <main class="container feed-layout">
        
        <section class="post-creator-box">
            <h2>Share an Academic Post</h2>
            <form id="postForm">
                <div class="input-group">

                    <textarea id="postContent" rows="3" placeholder="What academic ideas or projects are you working on, DM?..." required></textarea>
                </div>

                <button type="submit" class="btn">Post to Feed</button>
            </form>
        </section>

        <section class="feed-stream-section">
            <h2>Activity Feed</h2>
            <div id="feedContainer">

                <p id="emptyFeedMessage" style="color: #556B82; font-style: italic;">No posts yet. Be the first to share something!</p>
            </div>
        </section>

    </main>


    <footer>
        <p>&copy; 2026 Richfield Graduate Institute of Technology</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="feed.js"></script>
</body>
</html>
