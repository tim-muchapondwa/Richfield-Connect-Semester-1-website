<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richfield Connect - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">Richfield Connect</div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="feed.html">Feed</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="profile-container">
            
            <div class="profile-card-header">
                <h1 id="profileName">Loading Profile...</h1>
                <p id="profileCampus" class="badge">Campus: -</p>
            </div>

            <div class="profile-card-body">
                <div class="info-row">
                    <strong>Student Number:</strong>
                    <span id="profileStudent">-</span>
                </div>
                <div class="info-row">
                    <strong>Email Address:</strong>
                    <span id="profileEmail">-</span>
                </div>

                <div class="toggle-section">
                    <button id="toggleDetailsBtn" class="btn btn-secondary">Hide/Show Bio & Interests</button>
                    
                    <div id="collapsibleDetails">
                        <div class="detail-box">
                            <h3>Short Bio</h3>
                            <p id="profileBio">No bio added yet.</p>
                        </div>

                        <div class="detail-box">
                            <h3>My Academic Interests</h3>
                            <div id="profileTags" class="tags-container">
                                </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Richfield Graduate Institute of Technology</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
